  :root{
    --gold:#b08a57; --gold-soft:#d9bf94; --ink:#0b0d10; --text:#f3eee6; --muted:rgba(243,238,230,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{background:var(--ink);color:var(--text);font-family:"FbElitism",system-ui,sans-serif;overflow-x:hidden}

  /* fixed stage */
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{width:100%;height:100%;display:block}
  .shade{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(to top,rgba(5,6,8,.78) 0%,rgba(5,6,8,.15) 38%,rgba(5,6,8,0) 60%),
               linear-gradient(to bottom,rgba(5,6,8,.55) 0%,rgba(5,6,8,0) 22%)}

  /* scroll track */
  #track{position:relative;z-index:0}

  header{position:fixed;top:0;inset-inline:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:22px 40px}
  header img{height:38px;width:auto}
  .brand{display:flex;align-items:flex-end;gap:12px}
  .brand svg{height:58px;width:auto;color:var(--gold)}
  header .brand svg{height:52px;margin-bottom:-2px}
  header .cta{color:var(--text);text-decoration:none;font-size:14px;letter-spacing:.06em;border:1px solid rgba(217,191,148,.55);padding:10px 22px;border-radius:999px;transition:.3s}
  header .cta:hover{background:var(--gold);border-color:var(--gold);color:#111}

  /* captions */
  .captions{position:fixed;z-index:3;inset-inline-start:7vw;bottom:15vh;max-width:560px;pointer-events:none}
  .cap{position:absolute;bottom:0;inset-inline-start:0;width:min(560px,86vw);opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
  .cap.on{opacity:1;transform:none}
  .cap .num{font-size:13px;letter-spacing:.3em;color:var(--gold-soft);margin-bottom:14px;display:flex;align-items:center;gap:12px}
  .cap .num::after{content:"";width:48px;height:1px;background:var(--gold)}
  .cap h2{font-family:"FbElitism",serif;font-weight:400;font-size:clamp(34px,4.6vw,64px);line-height:1.08;margin-bottom:14px}
  .cap p{font-size:clamp(15px,1.25vw,18px);line-height:1.65;color:var(--muted);font-weight:300}
  .cap .more{all:unset;pointer-events:auto;cursor:pointer;margin-top:26px;display:inline-flex;align-items:center;gap:12px;background:var(--gold);color:#111;font-family:inherit;font-size:clamp(16px,1.3vw,19px);letter-spacing:.04em;padding:15px 34px;border-radius:999px;transition:.3s}
  .cap .more:hover{background:var(--gold-soft)}
  .cap .more svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* opening title, dead center */
  .hero{position:fixed;inset:0;z-index:3;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transform:scale(.97);transition:opacity .9s ease,transform .9s ease}
  .hero.on{opacity:1;transform:none}
  .hero h1{font-family:"FbElitism",serif;font-weight:400;font-size:clamp(96px,19vw,300px);line-height:1;letter-spacing:.02em;color:var(--text);text-shadow:0 6px 40px rgba(0,0,0,.45)}

  /* project details */
  #details{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(5,6,8,.72);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
  #details.open{opacity:1;pointer-events:auto}
  #details .sheet{position:relative;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#111418;border:1px solid rgba(217,191,148,.3);border-radius:18px;padding:40px clamp(22px,4vw,44px)}
  #details .brand{justify-content:center;margin-bottom:22px}
  #details .brand img{height:40px}
  #details h3{font-weight:400;font-size:clamp(24px,2.6vw,32px);text-align:center;margin-bottom:8px}
  #details .lead{text-align:center;color:var(--muted);line-height:1.6;margin-bottom:28px}
  #details dl{display:grid;grid-template-columns:auto 1fr;gap:14px 24px;border-block:1px solid rgba(217,191,148,.2);padding:24px 0;margin-bottom:28px}
  #details dt{color:var(--gold-soft);font-size:14px;letter-spacing:.06em;white-space:nowrap}
  #details dd{color:var(--text);line-height:1.5}
  #details .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  #details .actions a{text-decoration:none;color:var(--text);border:1px solid rgba(217,191,148,.55);padding:13px 28px;border-radius:999px;transition:.3s}
  #details .actions a.primary{background:var(--gold);border-color:var(--gold);color:#111}
  #details .actions a:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:#111}
  #details .close{all:unset;cursor:pointer;position:absolute;top:16px;inset-inline-end:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.25s}
  #details .close:hover{color:var(--text);background:rgba(255,255,255,.08)}
  #details .close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

  /* chapter nav */
  nav.dots{position:fixed;z-index:4;inset-inline-end:34px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
  nav.dots button{all:unset;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;flex-direction:row-reverse;color:var(--muted);font-size:12px;letter-spacing:.12em}
  nav.dots button i{display:block;width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-soft);transition:.3s}
  nav.dots button span{opacity:0;transition:.3s}
  nav.dots button:hover span,nav.dots button.on span{opacity:1}
  nav.dots button.on i{background:var(--gold);border-color:var(--gold);transform:scale(1.35)}

  /* controls */
  .controls{position:fixed;z-index:4;bottom:34px;inset-inline-end:40px;display:flex;gap:10px;align-items:center}
  .controls button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;border:1px solid rgba(217,191,148,.5);display:grid;place-items:center;color:var(--text);background:rgba(10,12,15,.35);backdrop-filter:blur(6px);transition:.25s}
  .controls button:hover{background:var(--gold);border-color:var(--gold);color:#111}
  .controls svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .controls button[hidden]{display:none}
  .controls button.on{border-color:var(--gold);color:var(--gold-soft)}

  /* progress */
  .progress{position:fixed;z-index:4;bottom:0;inset-inline:0;height:2px;background:rgba(255,255,255,.08)}
  .progress b{display:block;height:100%;width:0;background:var(--gold);transform-origin:right}

  .hint{position:fixed;z-index:3;bottom:34px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.25em;color:var(--muted);transition:opacity .5s}
  .hint::after{content:"";display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(var(--gold),transparent);animation:drip 1.8s infinite}
  @keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* loader */
  #loader{position:fixed;inset:0;z-index:10;background:var(--ink);display:grid;place-items:center;transition:opacity .8s}
  #loader .in{text-align:center}
  #loader img{width:220px;opacity:.95}
  #loader .bar{width:220px;height:1px;background:rgba(255,255,255,.12);margin:28px auto 12px}
  #loader .bar b{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  #loader small{color:var(--muted);font-size:12px;letter-spacing:.2em}
  #loader.done{opacity:0;pointer-events:none}

  @media (max-width:760px){
    header{padding:16px 18px} header img{height:28px} header .brand svg{height:38px} header .cta{padding:8px 14px;font-size:12px}
    #details dl{grid-template-columns:1fr;gap:4px} #details dd{margin-bottom:10px}
    .captions{inset-inline-start:18px;bottom:120px}
    nav.dots{inset-inline-end:14px} nav.dots span{display:none}
    .controls{bottom:22px;inset-inline-end:18px} .controls button{width:42px;height:42px}
    .hint{display:none}
  }
</style>
</head>
<body>

<!-- building drawing used next to the logo -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="towerClip"><path d="M14 118C16 82 16 52 20 30L30 8L40 30C44 52 44 82 46 118Z"/></clipPath>
    <symbol id="tower" viewBox="0 0 60 122">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="2.2" d="M14 118C16 82 16 52 20 30L30 8L40 30C44 52 44 82 46 118"/>
        <path stroke-width="1.6" d="M30 8V1"/>
        <g stroke-width="1.1" clip-path="url(#towerClip)">
          <path d="M0 38Q15 35 30 38T60 38M0 46Q15 43 30 46T60 46M0 54Q15 51 30 54T60 54M0 62Q15 59 30 62T60 62M0 70Q15 67 30 70T60 70M0 78Q15 75 30 78T60 78M0 86Q15 83 30 86T60 86M0 94Q15 91 30 94T60 94M0 102Q15 99 30 102T60 102M0 110Q15 107 30 110T60 110"/>
          <path d="M30 8V118"/>
        </g>
        <path stroke-width="2" d="M4 119H56"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="loader"><div class="in">
  <div class="brand" style="justify-content:center"><svg viewBox="0 0 60 122" style="height:90px"><use href="#tower"/></svg><img src="logo.png" alt="הפסגה"></div>
  <div class="bar"><b id="lbar"></b></div>
  <small id="ltext">טוען 0%</small>
</div></div>

<div id="stage"><canvas id="c"></canvas></div>
<div class="shade"></div>

<header>
  <div class="brand"><svg viewBox="0 0 60 122"><use href="#tower"/></svg><img src="logo.png" alt="הפסגה"></div>
  <a class="cta" href="#" id="ctaTop">לתיאום פגישה</a>
</header>

<div class="hero" id="hero"><h1>הפסגה</h1></div>
<div class="captions" id="captions"></div>

<div id="details" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="sheet">
    <button class="close" id="dClose" title="סגירה"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="brand"><svg viewBox="0 0 60 122"><use href="#tower"/></svg><img src="logo.png" alt="הפסגה"></div>
    <h3 id="dTitle">פרטים על הפרויקט</h3>
    <p class="lead" id="dLead"></p>
    <dl id="dList"></dl>
    <div class="actions" id="dActions"></div>
  </div>
</div>
<nav class="dots" id="dots"></nav>

<div class="controls">
  <button id="prev" title="הקודם"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button id="play" title="נגן"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5l11 7-11 7z"/></svg></button>
  <button id="next" title="הבא"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="music" title="מוזיקה" hidden><svg viewBox="0 0 24 24" id="musicIcon"></svg></button>
</div>
<audio id="bgm" src="music.mp3" loop preload="none"></audio>

<div class="hint" id="hint">גללו לגילוי</div>
<div class="progress"><b id="pbar"></b></div>

<div id="track"></div>

<script>
/* ---------- content ---------- */
const CHAPTERS = [
  { frames:120, title:"הפסגה",                 text:"מגדל מגורים על קו המים. כאן השמיים מתחילים." },
  { frames:121, title:"אדריכלות בתנועה",        text:"קווים רכים שנפתחים אל הים, כמו גל שקפא באמצע תנועה." },
  { frames:121, title:"בין הים לעיר",           text:"מיקום שמחבר את קו החוף, הירוק והעיר — הכול מתחת לרגליים." },
  { frames:121, title:"נכנסים פנימה",           text:"המעבר מהנוף לבית קורה בצעד אחד." },
  { frames:120, title:"סלון בגובה השמיים",      text:"חלונות מרצפה לתקרה, אור של שקיעה בכל ערב." },
  { frames:120, title:"חלל כפול",               text:"גרם מדרגות פיסולי, תקרה כפולה ומרחב שנושם." },
  { frames:121, title:"פרטיות בקומה העליונה",   text:"מטבח שף, חומרים טבעיים ושקט של גובה." },
  { frames:120, title:"הבית שלכם בפסגה",        text:"מספר הדירות מוגבל. נשמח להראות לכם מקרוב." }
];
const PX_PER_FRAME = 14;          // scroll distance per frame (higher = slower)
const INTRO = 40;                 // scroll frames that hold on the opening still (intro.jpg) before the first clip
const FADE  = 18;                 // last intro frames, where the still dissolves into the first clip

/* project details shown by the closing call to action — replace the placeholders with the real details */
const PROJECT = {
  lead: "מגדל מגורים יוקרתי על קו המים, עם מספר מוגבל של דירות.",
  facts: [
    ["מיקום",        "קו החוף, בין הים לעיר"],
    ["סוג הפרויקט",  "מגדל מגורים יוקרתי"],
    ["דירות",         "דירות נוף ופנטהאוזים"],
    ["מפרט",          "חלונות מרצפה לתקרה, חללים כפולים, מטבח שף וחומרים טבעיים"],
    ["מועד אכלוס",   "יעודכן בקרוב"]
  ],
  phone: "050-0000000",            // placeholder
  whatsapp: "972500000000"         // placeholder, international format without +
};

/* ---------- index ---------- */
const starts=[]; let TOTAL=INTRO;
CHAPTERS.forEach(ch=>{starts.push(TOTAL); TOTAL+=ch.frames;});
const frames=new Array(TOTAL);    // Image objects
const loaded=new Uint8Array(TOTAL);
const intro=new Image();
const loc = g => { let c=CHAPTERS.length-1; while(c>0&&starts[c]>g) c--; return [c,g-starts[c]]; };   // intro frames count as chapter 0

/* ---------- build UI ---------- */
const capsEl=document.getElementById("captions"), dotsEl=document.getElementById("dots");
const caps=[];
CHAPTERS.forEach((ch,i)=>{
  let d;
  if(i===0) d=document.getElementById("hero");   // the opening chapter shows only the big centered title
  else {
    d=document.createElement("div"); d.className="cap";
    d.innerHTML=`<div class="num"><span dir="ltr">${String(i+1).padStart(2,"0")} / ${String(CHAPTERS.length).padStart(2,"0")}</span></div><h2>${ch.title}</h2><p>${ch.text}</p>`;
    if(i===CHAPTERS.length-1){
      const m=document.createElement("button"); m.className="more";
      m.innerHTML=`לפרטים על הפרויקט <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>`;
      m.onclick=openDetails; d.appendChild(m);
    }
    capsEl.appendChild(d);
  }
  caps.push(d);
  const b=document.createElement("button"); b.innerHTML=`<i></i><span>${ch.title}</span>`;
  b.onclick=()=>goTo(i); dotsEl.appendChild(b);
});
const dots=[...dotsEl.children];

/* ---------- details sheet ---------- */
const detailsEl=document.getElementById("details");
document.getElementById("dLead").textContent=PROJECT.lead;
PROJECT.facts.forEach(([k,v])=>{ const dt=document.createElement("dt"), dd=document.createElement("dd"); dt.textContent=k; dd.textContent=v; document.getElementById("dList").append(dt,dd); });
document.getElementById("dActions").innerHTML=
  `<a class="primary" href="tel:${PROJECT.phone.replace(/\D/g,"")}">התקשרו: <span dir="ltr">${PROJECT.phone}</span></a>`+
  `<a href="https://wa.me/${PROJECT.whatsapp}" target="_blank" rel="noopener">שלחו הודעה בוואטסאפ</a>`;
function openDetails(){ stopPlay(); detailsEl.classList.add("open"); }
function closeDetails(){ detailsEl.classList.remove("open"); }
document.getElementById("dClose").onclick=closeDetails;
detailsEl.onclick=e=>{ if(e.target===detailsEl) closeDetails(); };

const track=document.getElementById("track");
function sizeTrack(){ track.style.height=(TOTAL*PX_PER_FRAME+innerHeight)+"px"; }
sizeTrack();
const maxScroll=()=>document.documentElement.scrollHeight-innerHeight;

/* ---------- canvas ---------- */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  sizeTrack(); lastDrawn=-1;
}
addEventListener("resize",resize);

let lastDrawn=-1;
function draw(g){
  // nearest loaded frame (search backwards then forwards)
  let k=g;
  if(!loaded[k]){ let a=g,b=g; k=-1;
    while(a>=0||b<TOTAL){ if(a>=0&&loaded[a]){k=a;break} if(b<TOTAL&&loaded[b]){k=b;break} a--;b++; } }
  if(k<0||k===lastDrawn) return;
  if(k>=INTRO-FADE && k<INTRO && loaded[INTRO]){ cover(frames[INTRO],1); cover(intro,(INTRO-k)/FADE); }
  else cover(frames[k],1);
  lastDrawn=k;
}
function cover(img,alpha){
  const W=cv.width, H=cv.height;
  const s=Math.max(W/img.naturalWidth,H/img.naturalHeight);
  const w=img.naturalWidth*s, h=img.naturalHeight*s;
  ctx.globalAlpha=alpha; ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h); ctx.globalAlpha=1;
}

/* ---------- loading: each chapter is one file in seq/ (works from localhost and when opened directly) ---------- */
let done=0;
const lbar=document.getElementById("lbar"), ltext=document.getElementById("ltext"), loader=document.getElementById("loader");
function loadScript(src){ return new Promise(res=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=res; document.head.appendChild(s); }); }
function decodeChapter(c){
  const list=(window.SEQ||{})[c+1]||[];
  return Promise.all(list.map((uri,i)=>new Promise(res=>{
    const g=starts[c]+i, im=new Image();
    im.onload=()=>{loaded[g]=1; done++; res();}; im.onerror=()=>{done++; res();};
    im.src=uri; frames[g]=im;
  })));
}
async function loadChapter(c){ await loadScript(`seq/${c+1}.js`); await decodeChapter(c); if(window.SEQ) delete window.SEQ[c+1]; }
(async()=>{
  const first=CHAPTERS[0].frames;
  ltext.textContent="טוען";
  await new Promise(res=>{ intro.onload=intro.onerror=res; intro.src="intro.jpg"; });
  for(let g=0;g<INTRO;g++){ frames[g]=intro; loaded[g]=intro.naturalWidth?1:0; }
  const tick=setInterval(()=>{const p=Math.min(100,Math.round(done/first*100)); lbar.style.width=p+"%"; if(done) ltext.textContent=`טוען ${p}%`;},100);
  await loadChapter(0);
  clearInterval(tick); lbar.style.width="100%";
  resize(); loader.classList.add("done");
  for(let c=1;c<CHAPTERS.length;c++) await loadChapter(c);
})();

/* ---------- scroll → frame ---------- */
let target=0, current=0, activeCap=-1;
function onScroll(){
  const m=maxScroll(), p=m>0?Math.max(0,Math.min(1,scrollY/m)):0;
  target=p*(TOTAL-1);
  document.getElementById("pbar").style.width=(p*100)+"%";
  document.getElementById("hint").style.opacity=scrollY>40?0:1;
}
addEventListener("scroll",onScroll,{passive:true});

function loop(){
  current+= (target-current)*0.18;
  if(Math.abs(target-current)<0.05) current=target;
  const g=Math.round(current);
  draw(g);
  const [c,i]=loc(g);
  // caption visible during the middle of each chapter; the opening title is up from the first frame
  const show = c===0 ? (i<CHAPTERS[0].frames-10 ? 0 : -1)
             : i>6 && i<CHAPTERS[c].frames-10 ? c : (c===CHAPTERS.length-1 && i>6 ? c : -1);
  if(show!==activeCap){ caps.forEach((el,k)=>el.classList.toggle("on",k===show)); activeCap=show; }
  dots.forEach((d,k)=>d.classList.toggle("on",k===c));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- navigation ---------- */
const frameToY = g => g/(TOTAL-1)*maxScroll();
let anim=null;
function scrollToY(y,dur){
  cancelAnimationFrame(anim); const y0=scrollY, d=y-y0, t0=performance.now();
  dur = dur ?? Math.min(2600,Math.max(700,Math.abs(d)*0.9));
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    scrollTo(0,y0+d*e); if(k<1) anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step);
}
function curChapter(){ return loc(Math.round(target))[0]; }
function goTo(c){ stopPlay(); c=Math.max(0,Math.min(CHAPTERS.length-1,c));
  // land on the end of the chapter's intro (caption visible), so the clip plays on the way
  scrollToY(frameToY(starts[c]+CHAPTERS[c].frames-12));
}
document.getElementById("next").onclick=()=>{ const c=curChapter(); const endG=starts[c]+CHAPTERS[c].frames-12; goTo(Math.round(target)>=endG-1?c+1:c); };
document.getElementById("prev").onclick=()=>{ const c=curChapter(); stopPlay(); scrollToY(frameToY(c>0?starts[c-1]+CHAPTERS[c-1].frames-12:0)); };

/* autoplay: plays the sequence at real speed (24fps) */
let playing=false, lastT=0;
const playIcon=document.getElementById("playIcon");
function setIcon(){ playIcon.innerHTML = playing ? '<path d="M8 5v14M16 5v14"/>' : '<path d="M8 5l11 7-11 7z"/>'; }
function stopPlay(){ playing=false; setIcon(); }
function playStep(t){
  if(!playing) return;
  const dt=(t-lastT)/1000; lastT=t;
  const y=Math.min(maxScroll(), scrollY + dt*24*(maxScroll()/(TOTAL-1)));
  scrollTo(0,y);
  if(y>=maxScroll()-1){ stopPlay(); return; }
  requestAnimationFrame(playStep);
}
document.getElementById("play").onclick=()=>{
  cancelAnimationFrame(anim);
  playing=!playing; setIcon();
  if(playing){ if(scrollY>=maxScroll()-1) scrollTo(0,0); lastT=performance.now(); requestAnimationFrame(playStep); }
};
addEventListener("wheel",()=>{ if(playing) stopPlay(); cancelAnimationFrame(anim); },{passive:true});
addEventListener("touchstart",()=>{ if(playing) stopPlay(); cancelAnimationFrame(anim); },{passive:true});
addEventListener("keydown",e=>{
  if(detailsEl.classList.contains("open")){ if(e.key==="Escape") closeDetails(); return; }
  if(e.key==="ArrowDown"||e.key==="PageDown"||e.key==="ArrowLeft"){e.preventDefault();document.getElementById("next").click();}
  if(e.key==="ArrowUp"||e.key==="PageUp"||e.key==="ArrowRight"){e.preventDefault();document.getElementById("prev").click();}
  if(e.key===" "){e.preventDefault();document.getElementById("play").click();}
});
/* background music: plays music.mp3 from this folder; the button stays hidden when there is no such file */
const bgm=document.getElementById("bgm"), musicBtn=document.getElementById("music"), musicIcon=document.getElementById("musicIcon");
const SPEAKER='<path d="M4 9h4l5-4v14l-5-4H4z"/>';
let musicOn=false, fadeT;
function setMusicIcon(){ musicIcon.innerHTML = SPEAKER + (musicOn ? '<path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>' : '<path d="M17 9.5l5 5M22 9.5l-5 5"/>'); musicBtn.classList.toggle("on",musicOn); }
function setMusic(on){
  musicOn=on; setMusicIcon(); clearInterval(fadeT);
  if(on){ bgm.volume=0; bgm.play().catch(()=>{ musicOn=false; setMusicIcon(); }); }
  fadeT=setInterval(()=>{
    bgm.volume=Math.max(0,Math.min(.6,bgm.volume+(on?.04:-.06)));
    if(on ? bgm.volume>=.6 : bgm.volume<=0){ clearInterval(fadeT); if(!on) bgm.pause(); }
  },60);
}
musicBtn.onclick=()=>setMusic(!musicOn);
setMusicIcon();
fetch("music.mp3",{method:"HEAD"}).then(r=>{ if(r.ok) musicBtn.hidden=false; }).catch(()=>{});

document.getElementById("ctaTop").onclick=e=>{e.preventDefault(); goTo(CHAPTERS.length-1);};
onScroll();
</script>
</body>
</html>
